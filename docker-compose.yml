version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: commandops-postgres
    restart: always
    environment:
      POSTGRES_USER: commandops
      POSTGRES_PASSWORD: commandops123
      POSTGRES_DB: commandops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commandops -d commandops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: commandops-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://commandops:commandops123@postgres:5432/commandops_db?schema=public
      - AUTH_SECRET=production_secret_key_commandops_2026_xyz
      - DISCORD_APPLICATION_ID=${DISCORD_APPLICATION_ID}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - AI_PROVIDER=${AI_PROVIDER:-fallback}
      - AI_API_KEY=${AI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
