name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: commandops
          POSTGRES_PASSWORD: commandops123
          POSTGRES_DB: commandops_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Prisma DB Schema
        run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://commandops:commandops123@localhost:5432/commandops_db?schema=public"

      - name: Run Unit & Integration Tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://commandops:commandops123@localhost:5432/commandops_db?schema=public"
          AUTH_SECRET: "test_secret_12345"

      - name: Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://commandops:commandops123@localhost:5432/commandops_db?schema=public"
          AUTH_SECRET: "test_secret_12345"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: commandops:ci
